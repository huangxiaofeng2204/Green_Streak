<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuỗi Ngày Sống Xanh - Green Streak</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 text-slate-100">

  <div id="root" class="w-full max-w-md bg-slate-900 min-h-screen flex flex-col shadow-2xl relative overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper lấy ngày hiện tại định dạng YYYY-MM-DD
    const getTodayString = () => {
      const today = new Date();
      return today.toISOString().split('T')[0];
    };

    // Danh sách 10 nhiệm vụ hàng ngày
    const DAILY_TASKS = [
      { id: 't1', title: 'Chiến thần rút chốt', points: 20, icon: 'fa-plug-circle-xmark', req: 'Rút 8 phích cắm điện (Video 10s / 1 ảnh)' },
      { id: 't2', title: 'Phong ấn lôi thần', points: 10, icon: 'fa-toggle-off', req: 'Tắt 5 công tắc điện khi không dùng (Video 10s / 1 ảnh)' },
      { id: 't3', title: 'Thực thần càn quét', points: 10, icon: 'fa-utensils', req: 'Vét sạch đồ ăn, không để thừa (1 ảnh)' },
      { id: 't4', title: 'Thủy bình độc bản', points: 30, icon: 'fa-bottle-water', req: 'Sử dụng bình/ly cá nhân để mua nước (1 ảnh)' },
      { id: 't5', title: 'Căng hải vào việc', points: 20, icon: 'fa-person-walking', req: 'Đi bộ/xe đạp thay vì đi xe máy (Video 10s / 1 ảnh)' },
      { id: 't6', title: 'Túi/Balo vạn năng', points: 30, icon: 'fa-bag-shopping', req: 'Mang túi riêng/balo đựng đồ mới mua (1 ảnh tại cửa hàng)' },
      { id: 't7', title: 'Khai mở phong môn', points: 10, icon: 'fa-window-maximize', req: 'Mở 4 cánh cửa sổ lấy gió tự nhiên (1 ảnh)' },
      { id: 't8', title: 'Cấp thủy dưỡng mộc', points: 10, icon: 'fa-seedling', req: 'Tưới cây xanh (Video 5s / 1 ảnh)' },
      { id: 't9', title: 'Thanh trừng rác thải', points: 10, icon: 'fa-trash-can', req: 'Vứt rác phân loại đúng nơi quy định (1 ảnh)' },
      { id: 't10', title: 'Độ lại đồ phế', points: 50, icon: 'fa-recycle', req: 'Tái chế 1 sản phẩm có tính ứng dụng (1 ảnh)' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('tasks'); // 'tasks', 'leaderboard', 'profile', 'admin'
      const [todayStr, setTodayStr] = useState(getTodayString());
      
      // User Profile local state (Giả lập Firebase Anonymous Auth & Realtime Data)
      const [user, setUser] = useState({
        uid: 'user_' + Math.floor(1000 + Math.random() * 9000),
        name: 'EcoHero_' + Math.floor(1000 + Math.random() * 9000),
        totalPoints: 0
      });

      // Trạng thái nhiệm vụ của User theo ngày { taskId: { status: 'pending'|'approved'|'rejected', proofUrl: '' } }
      const [taskSubmissions, setTaskSubmissions] = useState({});
      
      // Bảng xếp hạng giả lập (Realtime DB Sync)
      const [leaderboard, setLeaderboard] = useState([
        { uid: 'u1', name: 'XanhToanDien', totalPoints: 180 },
        { uid: 'u2', name: 'SốngXanhMỗiNgày', totalPoints: 150 },
        { uid: 'u3', name: 'GreenRanger', totalPoints: 110 }
      ]);

      // Admin State: Các bài nộp chờ duyệt toàn hệ thống
      const [pendingApprovals, setPendingApprovals] = useState([]);

      // Modal tải ảnh minh chứng
      const [selectedTask, setSelectedTask] = useState(null);
      const [proofInput, setProofInput] = useState('');

      // Cập nhật tiến độ hoàn thành trong ngày
      const approvedCount = DAILY_TASKS.filter(t => taskSubmissions[t.id]?.status === 'approved').length;
      const progressPercent = Math.round((approvedCount / DAILY_TASKS.length) * 100);

      // Nộp minh chứng cho Nhiệm vụ
      const handleSubmitProof = (e) => {
        e.preventDefault();
        if (!selectedTask || !proofInput) return;

        const newSubmission = {
          taskId: selectedTask.id,
          taskTitle: selectedTask.title,
          points: selectedTask.points,
          status: 'pending',
          proofUrl: proofInput,
          userUid: user.uid,
          userName: user.name,
          date: todayStr
        };

        // Cập nhật trạng thái người dùng -> ⏳ Chờ duyệt
        setTaskSubmissions(prev => ({
          ...prev,
          [selectedTask.id]: newSubmission
        }));

        // Đưa vào danh sách duyệt của Admin (Ban Tổ Chức)
        setPendingApprovals(prev => [...prev, newSubmission]);

        setSelectedTask(null);
        setProofInput('');
      };

      // Admin duyệt nhiệm vụ
      const handleAdminAction = (submission, isApprove) => {
        if (isApprove) {
          // Cộng điểm cho User
          if (submission.userUid === user.uid) {
            setUser(prev => ({ ...prev, totalPoints: prev.totalPoints + submission.points }));
            setTaskSubmissions(prev => ({
              ...prev,
              [submission.taskId]: { ...prev[submission.taskId], status: 'approved' }
            }));
          }
        } else {
          // Từ chối
          if (submission.userUid === user.uid) {
            setTaskSubmissions(prev => ({
              ...prev,
              [submission.taskId]: { ...prev[submission.taskId], status: 'rejected' }
            }));
          }
        }

        // Xóa khỏi danh sách chờ duyệt
        setPendingApprovals(prev => prev.filter(item => !(item.userUid === submission.userUid && item.taskId === submission.taskId)));
      };

      return (
        <div className="flex flex-col h-full min-h-screen pb-16">
          {/* Top Progress Bar */}
          <div className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md p-4 border-b border-slate-800">
            <div className="flex justify-between items-center mb-1 text-xs text-slate-300 font-semibold">
              <span>TIẾN ĐỘ HÔM NAY ({todayStr})</span>
              <span>{approvedCount}/{DAILY_TASKS.length} HOÀN THÀNH</span>
            </div>
            {/* Thanh tiến trình màu trắng */}
            <div className="w-full bg-slate-700 h-2.5 rounded-full overflow-hidden">
              <div 
                className="bg-white h-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(255,255,255,0.8)]"
                style={{ width: `${progressPercent}%` }}
              ></div>
            </div>
          </div>

          {/* Body Content according to Tab */}
          <div className="flex-1 p-4 overflow-y-auto no-scrollbar">
            {activeTab === 'tasks' && (
              <div className="space-y-3">
                <div className="flex justify-between items-center mb-2">
                  <h1 className="text-lg font-bold text-emerald-400 flex items-center gap-2">
                    <i className="fa-solid fa-leaf"></i> 10 Nhiệm Vụ Xanh
                  </h1>
                  <span className="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded-full font-mono">
                    Tổng: {user.totalPoints}đ
                  </span>
                </div>

                {DAILY_TASKS.map(task => {
                  const sub = taskSubmissions[task.id];
                  const status = sub?.status;

                  return (
                    <div 
                      key={task.id} 
                      className={`p-3.5 rounded-xl border transition-all duration-200 flex items-center justify-between ${
                        status === 'approved' 
                          ? 'bg-emerald-950/30 border-emerald-500/50' 
                          : status === 'pending'
                          ? 'bg-amber-950/20 border-amber-500/40'
                          : 'bg-slate-800/80 border-slate-700 hover:border-slate-600'
                      }`}
                    >
                      <div className="flex items-center gap-3 pr-2">
                        <div className={`w-10 h-10 rounded-lg flex items-center justify-center text-lg ${
                          status === 'approved' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-700 text-emerald-400'
                        }`}>
                          <i className={`fa-solid ${task.icon}`}></i>
                        </div>
                        <div>
                          <div className="font-semibold text-sm flex items-center gap-2">
                            {task.title}
                            <span className="text-xs text-amber-400 font-medium">+{task.points}đ</span>
                          </div>
                          <div className="text-xs text-slate-400 mt-0.5">{task.req}</div>
                        </div>
                      </div>

                      {/* Nút tác vụ hoặc trạng thái */}
                      <div>
                        {status === 'approved' && (
                          <span className="text-xs font-bold text-emerald-400 bg-emerald-500/20 px-2.5 py-1 rounded-full border border-emerald-500/30">
                            ✓ Đã duyệt
                          </span>
                        )}
                        {status === 'pending' && (
                          <span className="text-xs font-bold text-amber-400 bg-amber-500/20 px-2.5 py-1 rounded-full border border-amber-500/30 animate-pulse">
                            ⏳ Chờ duyệt
                          </span>
                        )}
                        {(!status || status === 'rejected') && (
                          <button
                            onClick={() => setSelectedTask(task)}
                            className="text-xs font-medium bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3 py-1.5 rounded-lg transition-all active:scale-95 shadow-md shadow-emerald-500/20"
                          >
                            {status === 'rejected' ? 'Làm lại' : 'Nộp minh chứng'}
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* Bảng Xếp Hạng */}
            {activeTab === 'leaderboard' && (
              <div className="space-y-3">
                <h1 className="text-lg font-bold text-amber-400 flex items-center gap-2 mb-3">
                  <i className="fa-solid fa-trophy"></i> Bảng Vàng Vinh Danh
                </h1>

                {/* Kết hợp User hiện tại vào Bảng xếp hạng */}
                {[...leaderboard, { uid: user.uid, name: user.name + ' (Bạn)', totalPoints: user.totalPoints }]
                  .sort((a, b) => b.totalPoints - a.totalPoints)
                  .map((item, idx) => (
                    <div 
                      key={item.uid}
                      className={`p-3 rounded-xl border flex items-center justify-between ${
                        item.uid === user.uid 
                          ? 'bg-emerald-900/40 border-emerald-500/60 font-semibold' 
                          : 'bg-slate-800 border-slate-700'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold ${
                          idx === 0 ? 'bg-amber-400 text-slate-950' :
                          idx === 1 ? 'bg-slate-300 text-slate-950' :
                          idx === 2 ? 'bg-amber-700 text-slate-100' : 'bg-slate-700 text-slate-400'
                        }`}>
                          {idx + 1}
                        </span>
                        <span className="text-sm">{item.name}</span>
                      </div>
                      <span className="text-sm font-mono text-emerald-400">{item.totalPoints}đ</span>
                    </div>
                  ))}
              </div>
            )}

            {/* Tab Hồ sơ */}
            {activeTab === 'profile' && (
              <div className="space-y-4">
                <h1 className="text-lg font-bold text-indigo-400 flex items-center gap-2">
                  <i className="fa-solid fa-user-gear"></i> Hồ Sơ Nhân Vật
                </h1>

                <div className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-4">
                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Mã thiết bị (Anonymous ID)</label>
                    <input 
                      type="text" 
                      value={user.uid} 
                      disabled 
                      className="w-full bg-slate-900 text-slate-500 border border-slate-700 rounded-lg px-3 py-2 text-xs font-mono"
                    />
                  </div>

                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Tên hiển thị trên Bảng Vàng</label>
                    <input 
                      type="text" 
                      value={user.name} 
                      onChange={(e) => setUser(prev => ({ ...prev, name: e.target.value }))}
                      className="w-full bg-slate-900 text-white border border-slate-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-400"
                    />
                  </div>

                  <div className="pt-2 border-t border-slate-700 flex justify-between items-center text-xs text-slate-400">
                    <span>Tổng điểm tích lũy:</span>
                    <span className="text-emerald-400 text-base font-bold font-mono">{user.totalPoints}đ</span>
                  </div>
                </div>
              </div>
            )}

            {/* Tab Admin (BTC Duyệt bài) */}
            {activeTab === 'admin' && (
              <div className="space-y-3">
                <h1 className="text-lg font-bold text-rose-400 flex items-center gap-2 mb-3">
                  <i className="fa-solid fa-user-shield"></i> Khu Vực Ban Tổ Chức (Duyệt Minh Chứng)
                </h1>

                {pendingApprovals.length === 0 ? (
                  <div className="text-center py-8 text-slate-500 text-sm">
                    Không có nhiệm vụ nào đang chờ duyệt.
                  </div>
                ) : (
                  pendingApprovals.map((item, idx) => (
                    <div key={idx} className="bg-slate-800 border border-slate-700 rounded-xl p-3.5 space-y-2">
                      <div className="flex justify-between items-start">
                        <div>
                          <div className="font-semibold text-sm text-emerald-400">{item.taskTitle} (+{item.points}đ)</div>
                          <div className="text-xs text-slate-400">Thành viên: <span className="text-white">{item.userName}</span></div>
                        </div>
                        <span className="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-mono">{item.date}</span>
                      </div>

                      {/* Minh chứng ảnh/video */}
                      <div className="bg-slate-900 rounded-lg p-2 border border-slate-800">
                        <div className="text-xs text-slate-400 mb-1">Minh chứng (Ảnh/Video URL):</div>
                        {item.proofUrl.startsWith('http') ? (
                          <img src={item.proofUrl} alt="Proof" className="w-full h-36 object-cover rounded-md" />
                        ) : (
                          <div className="text-xs text-slate-300 bg-slate-950 p-2 rounded italic break-all">
                            "{item.proofUrl}"
                          </div>
                        )}
                      </div>

                      <div className="flex gap-2 pt-1">
                        <button 
                          onClick={() => handleAdminAction(item, true)}
                          className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold py-1.5 rounded-lg text-xs transition-all"
                        >
                          Duyệt (+{item.points}đ)
                        </button>
                        <button 
                          onClick={() => handleAdminAction(item, false)}
                          className="flex-1 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/30 font-semibold py-1.5 rounded-lg text-xs transition-all"
                        >
                          Từ chối
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            )}
          </div>

          {/* Modal Nộp Minh Chứng */}
          {selectedTask && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-4 space-y-3">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-sm text-emerald-400">Nộp Minh Chứng: {selectedTask.title}</h3>
                  <button onClick={() => setSelectedTask(null)} className="text-slate-400 hover:text-white">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <p className="text-xs text-slate-300 bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/50">
                  <i className="fa-solid fa-circle-info text-amber-400 mr-1"></i> {selectedTask.req}
                </p>

                <form onSubmit={handleSubmitProof} className="space-y-3">
                  <div>
                    <label className="text-xs text-slate-300 block mb-1">Dán liên kết Ảnh/Video hoặc Mô tả minh chứng:</label>
                    <textarea 
                      rows="3"
                      required
                      placeholder="Dán URL ảnh/video từ Imgur, Drive, TikTok hoặc mô tả chi tiết..."
                      value={proofInput}
                      onChange={(e) => setProofInput(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-emerald-400"
                    ></textarea>
                  </div>

                  <div className="flex gap-2">
                    <button 
                      type="button" 
                      onClick={() => setSelectedTask(null)}
                      className="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded-lg font-medium"
                    >
                      Hủy
                    </button>
                    <button 
                      type="submit" 
                      className="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs py-2 rounded-lg font-bold"
                    >
                      Gửi duyệt
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Bottom Navigation Bar */}
          <div className="fixed bottom-0 w-full max-w-md bg-slate-900/95 backdrop-blur-md border-t border-slate-800 flex justify-around py-2.5 z-40 text-xs">
            <button 
              onClick={() => setActiveTab('tasks')}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'tasks' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-solid fa-list-check text-base"></i>
              <span>Nhiệm vụ</span>
            </button>
            <button 
              onClick={() => setActiveTab('leaderboard')}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'leaderboard' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-solid fa-trophy text-base"></i>
              <span>Bảng vàng</span>
            </button>
            <button 
              onClick={() => setActiveTab('profile')}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'profile' ? 'text-emerald-400 font-bold' : 'text-slate-400'}`}
            >
              <i className="fa-solid fa-user text-base"></i>
              <span>Hồ sơ</span>
            </button>
            <button 
              onClick={() => setActiveTab('admin')}
              className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'admin' ? 'text-rose-400 font-bold' : 'text-slate-500'}`}
            >
              <i className="fa-solid fa-shield-halved text-base"></i>
              <span>BTC Admin</span>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
